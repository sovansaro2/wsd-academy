    <meta name="theme-color" content="#194350" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WSD Academy" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>WSD Academy - កម្មវិធីអប់រំ និងដោះស្រាយលំហាត់</title>
    <meta name="description" content="WSD Academy - វេទិកាអប់រំឌីជីថល ជំនួយការដោះស្រាយលំហាត់ និងវិញ្ញាសាបាក់ឌុប" />
    <meta property="og:title" content="WSD Academy - កម្មវិធីអប់រំ និងដោះស្រាយលំហាត់" />
    <meta property="og:description" content="WSD Academy - វេទិកាអប់រំឌីជីថល ជំនួយការដោះស្រាយលំហាត់ និងវិញ្ញាសាបាក់ឌុប" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #194350;
      }
      @keyframes wsdBootDot{0%,80%,100%{transform:translateY(0) scale(.72);opacity:.38}40%{transform:translateY(-5px) scale(1);opacity:1}}
      .wsd-boot-dot{width:10px;height:10px;border-radius:9999px;background:#38BDF8;display:inline-block;animation:wsdBootDot 1.15s cubic-bezier(.45,.05,.55,.95) infinite}
      @media(prefers-reduced-motion:reduce){.wsd-boot-dot{animation:none;opacity:.85}}
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Koulen&family=Rajdhani:wght@500;600;700&family=STIX+Two+Math&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
  </head>
  <body class="bg-[#194350] text-white antialiased selection:bg-[#38BDF8]/30 selection:text-white min-h-screen m-0 p-0">
    <div id="root">
      <div style="position:fixed;inset:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#194350;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="wsd-boot-dot" style="animation-delay:0ms"></span>
          <span class="wsd-boot-dot" style="animation-delay:150ms"></span>
          <span class="wsd-boot-dot" style="animation-delay:300ms"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
